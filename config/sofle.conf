# Configuracoes extras do Sofle

# Bateria: a esquerda busca o nivel da direita e reporta os dois ao computador (via Bluetooth)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Encoders (knobs): o driver vem desligado por padrao no shield do Sofle
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Telas OLED acima dos knobs
CONFIG_ZMK_DISPLAY=y
