# Firmware do Sofle v2 (ZMK v0.3)
# Esquerda: metade central, com ZMK Studio via USB
# Direita: periferica
include:
  - board: nice_nano_v2
    shield: sofle_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: sofle_right
  - board: nice_nano_v2
    shield: settings_reset
